<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Jukebox - Advanced Configurator</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #059669;
            --warning: #d97706;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --disabled: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }
        header {
            grid-column: span 2;
            margin-bottom: 2rem;
            text-align: center;
        }
        h1 { margin: 0; }
        .description { color: var(--muted); margin-bottom: 1.5rem; }

        .presets-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            background: var(--card);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .preset-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .preset-btn:hover { border-color: var(--primary); color: var(--primary); }
        .preset-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .config-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: opacity 0.3s;
        }
        .config-section.disabled {
            opacity: 0.6;
            background: var(--disabled);
            pointer-events: none;
            position: relative;
        }
        .disabled-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(248, 250, 252, 0.8);
            z-index: 10;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: var(--success);
            border-radius: 1rem;
        }
        .config-section.disabled .disabled-overlay { display: flex; }

        .section-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .option-card {
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .option-card:hover { border-color: var(--primary); }
        .option-card.selected {
            border-color: var(--primary);
            background: #eff6ff;
        }
        .option-name { font-weight: 600; display: block; margin-bottom: 0.25rem; }
        .option-cost { color: var(--primary); font-family: monospace; font-weight: 700; }
        .option-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; flex-grow: 1; }

        .option-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            cursor: zoom-in;
            background: #eee;
        }
        
        .qty-spinner {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border);
        }
        .qty-btn {
            background: var(--border);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover { background: #cbd5e1; }
        .qty-val { font-weight: 700; min-width: 24px; text-align: center; }

        .product-link {
            font-size: 0.75rem;
            color: var(--primary);
            text-decoration: none;
            display: inline-block;
            margin-top: 0.5rem;
            font-weight: 600;
        }
        .product-link:hover { text-decoration: underline; }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .image-modal img { 
            max-width: 90%; 
            max-height: 90%; 
            border-radius: 0.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* Sidebar Stats */
        .sidebar {
            position: sticky;
            top: 2rem;
            height: fit-content;
        }
        .stats-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        .total-price {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 1rem 0;
        }
        .bom-list {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .bom-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .bom-item-name { color: var(--muted); }

        @media (max-width: 950px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NFC Jukebox Hardware Builder</h1>
            <p class="description">Select components and quantities to see how architecture choices affect cost.</p>
            <div class="presets-bar" id="presets-bar">
                <span style="font-weight: 700; color: var(--muted); margin-right: 1rem;">PRESETS:</span>
            </div>
        </header>

        <main id="config-main">
            <!-- Sections will be injected here -->
        </main>

        <aside class="sidebar">
            <div class="stats-card">
                <h3>Estimated Build Total</h3>
                <div class="total-price" id="total-price">$0.00</div>
                <div id="bom-summary" class="bom-list">
                    <!-- BOM Summary will be injected here -->
                </div>
                <button class="btn" style="width:100%; margin-top:1rem; background: var(--primary); color:white; border:none; padding:1rem; border-radius:0.5rem; font-weight:700; cursor:pointer;" onclick="window.print()">Export BOM</button>
            </div>
        </aside>
    </div>

    <div id="image-modal" class="image-modal" onclick="this.style.display='none'">
        <img id="modal-img" src="" alt="Hardware Preview">
    </div>

    <script>
        const configData = {
            presets: [
                {
                    id: "discrete-preset",
                    name: "Discrete (Original)",
                    selections: {
                        mcu: "s3-dev",
                        display_p: "tft-35",
                        display_s: "epaper",
                        charger: "tp4056",
                        ui_input: "physical-ui",
                        nfc: "pn532",
                        peripherals: "basic-sensors",
                        docking: "qi-18650",
                        mechanicals: "standard-mech"
                    },
                    quantities: {
                        ui_input: 5
                    }
                },
                {
                    id: "integrated-preset",
                    name: "Integrated (Optimized)",
                    selections: {
                        mcu: "waveshare-s3",
                        display_p: "none-p",
                        display_s: "lcd-labels",
                        charger: "integrated-pmic",
                        ui_input: "big-red",
                        nfc: "pn532",
                        peripherals: "basic-sensors",
                        docking: "qi-18650",
                        mechanicals: "simple-mech"
                    },
                    quantities: {
                        ui_input: 1
                    }
                }
            ],
            sections: [
                {
                    id: "mcu",
                    title: "Main Controller (MCU)",
                    options: [
                        { 
                            id: "s3-dev", 
                            name: "ESP32-S3 DevKit", 
                            cost: 12.00, 
                            desc: "Standard modular approach for developers.",
                            image: "https://docs.espressif.com/projects/esp-dev-kits/en/latest/_images/esp32-s3-devkitc-1-v1.1-front.png",
                            link: "https://www.espressif.com/en/products/devkits/esp32-s3-devkitc-1"
                        },
                        { 
                            id: "waveshare-s3", 
                            name: "Waveshare 3.5\" S3 (Integrated)", 
                            cost: 31.00, 
                            desc: "Integrated display & charger PMIC.", 
                            provides: ["mcu", "display_p", "charger"],
                            image: "https://www.waveshare.com/media/catalog/product/e/s/esp32-s3-touch-lcd-3.5-1.jpg",
                            link: "https://www.waveshare.com/esp32-s3-touch-lcd-3.5.htm"
                        },
                        { 
                            id: "sunton-s3", 
                            name: "Sunton 3.5\" S3 (CYD)", 
                            cost: 24.00, 
                            desc: "Budget integrated module (Cheap Yellow Display).", 
                            provides: ["mcu", "display_p", "charger"],
                            image: "https://openhasp.com/0.7.0/assets/images/devices/sunton/esp32-3248s035.jpg",
                            link: "https://www.aliexpress.com/item/1005005968339683.html"
                        }
                    ]
                },
                {
                    id: "display_p",
                    title: "Primary Display",
                    options: [
                        { 
                            id: "tft-35", 
                            name: "3.5\" TFT LCD (SPI)", 
                            cost: 28.00, 
                            desc: "Standard ILI9488 or similar SPI display.",
                            image: "https://cdn-shop.adafruit.com/970x728/2050-05.jpg",
                            link: "https://www.adafruit.com/product/2050"
                        },
                        { id: "none-p", name: "None / Provided", cost: 0, desc: "Already included in selected module." }
                    ]
                },
                {
                    id: "display_s",
                    title: "Secondary Labels",
                    options: [
                        { 
                            id: "epaper", 
                            name: "2.13\" SPI ePaper", 
                            cost: 18.00, 
                            desc: "Dedicated low-power display for slot labels.",
                            image: "https://www.waveshare.com/media/catalog/product/2/v/2.13inch-e-paper-module-1.jpg",
                            link: "https://www.waveshare.com/2.13inch-e-paper-module.htm"
                        },
                        { id: "lcd-labels", name: "LCD Top Section", cost: 0, desc: "Software-rendered labels on primary display." }
                    ]
                },
                {
                    id: "charger",
                    title: "Power Management",
                    options: [
                        { 
                            id: "tp4056", 
                            name: "TP4056 + Protection", 
                            cost: 5.00, 
                            desc: "Discrete Li-ion charging and protection circuit.",
                            image: "https://cdn-shop.adafruit.com/970x728/1904-03.jpg",
                            link: "https://www.adafruit.com/product/1904"
                        },
                        { id: "integrated-pmic", name: "Integrated (PMIC)", cost: 0, desc: "Onboard AXP2101 or similar." }
                    ]
                },
                {
                    id: "ui_input",
                    title: "User Interface Buttons",
                    options: [
                        { 
                            id: "physical-ui", 
                            name: "IP67 Sealed Buttons", 
                            cost: 2.50, 
                            desc: "Tactile buttons for D-pad/Volume.",
                            can_have_qty: true,
                            image: "https://cdn-shop.adafruit.com/970x728/1119-00.jpg",
                            link: "https://www.adafruit.com/product/1119"
                        },
                        { 
                            id: "big-red", 
                            name: "Big Red Button", 
                            cost: 6.00, 
                            desc: "Large arcade-style skip button.",
                            can_have_qty: true,
                            image: "https://cdn-shop.adafruit.com/970x728/1185-00.jpg",
                            link: "https://www.adafruit.com/product/1185"
                        },
                        { id: "touch-ui", name: "Touch-screen UI", cost: 0, desc: "Virtual software buttons." }
                    ]
                },
                {
                    id: "nfc",
                    title: "NFC Reader",
                    options: [
                        { 
                            id: "pn532", 
                            name: "PN532 Module", 
                            cost: 14.00, 
                            desc: "Industry standard NFC reader (V3/V4).",
                            image: "https://cdn-shop.adafruit.com/970x728/364-00.jpg",
                            link: "https://www.adafruit.com/product/364"
                        }
                    ]
                },
                {
                    id: "peripherals",
                    title: "Sensors & Feedback",
                    options: [
                        { 
                            id: "basic-sensors", 
                            name: "Sensor Kit", 
                            cost: 6.50, 
                            desc: "PIR + Vibration + Hall Effect kit.",
                            image: "https://cdn-shop.adafruit.com/970x728/189-02.jpg",
                            link: "https://www.adafruit.com/product/189"
                        }
                    ]
                },
                {
                    id: "docking",
                    title: "Docking & Power",
                    options: [
                        { 
                            id: "qi-18650", 
                            name: "Qi + 18650 Combo", 
                            cost: 16.00, 
                            desc: "10W Wireless charging + 3500mAh 18650.",
                            image: "https://cdn-shop.adafruit.com/970x728/1781-00.jpg",
                            link: "https://www.adafruit.com/product/1781"
                        }
                    ]
                },
                {
                    id: "mechanicals",
                    title: "Enclosure & Hardware",
                    options: [
                        { id: "standard-mech", name: "Filament + Fasteners", cost: 25.00, desc: "Case materials & M3 bolt set." },
                        { id: "simple-mech", name: "Budget Setup", cost: 15.00, desc: "Minimalist shell & snap-fit parts." }
                    ]
                }
            ]
        };

        const selections = {};
        const quantities = {};
        const main = document.getElementById('config-main');
        const presetsBar = document.getElementById('presets-bar');

        function init() {
            // Default selections
            configData.sections.forEach(section => {
                selections[section.id] = section.options[0].id;
                quantities[section.id] = 1;
            });
            renderPresets();
            render();
        }

        function renderPresets() {
            configData.presets.forEach(preset => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.innerText = preset.name;
                btn.onclick = () => applyPreset(preset);
                presetsBar.appendChild(btn);
            });
        }

        function applyPreset(preset) {
            Object.keys(preset.selections).forEach(key => {
                selections[key] = preset.selections[key];
            });
            Object.keys(preset.quantities || {}).forEach(key => {
                quantities[key] = preset.quantities[key];
            });
            // Reset others to 1
            configData.sections.forEach(s => {
                if (!(preset.quantities && preset.quantities[s.id])) {
                    quantities[s.id] = 1;
                }
            });
            render();
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === preset.name);
            });
        }

        function openModal(imgSrc) {
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('image-modal').style.display = 'flex';
        }

        function updateQty(sectionId, delta) {
            quantities[sectionId] = Math.max(1, (quantities[sectionId] || 1) + delta);
            render();
        }

        function render() {
            main.innerHTML = '';
            let total = 0;
            const activeBom = [];
            const providedBy = {};

            // Calculate "Provides" first
            configData.sections.forEach(section => {
                const selectedOption = section.options.find(o => o.id === selections[section.id]);
                if (selectedOption.provides) {
                    selectedOption.provides.forEach(pId => {
                        if (pId !== section.id) {
                            providedBy[pId] = selectedOption.name;
                        }
                    });
                }
            });

            configData.sections.forEach(section => {
                const sectionId = section.id;
                const sectionDiv = document.createElement('div');
                sectionDiv.className = `config-section ${providedBy[sectionId] ? 'disabled' : ''}`;
                
                const disabledOverlay = document.createElement('div');
                disabledOverlay.className = 'disabled-overlay';
                disabledOverlay.innerText = `Covered by ${providedBy[sectionId]}`;
                sectionDiv.appendChild(disabledOverlay);

                const title = document.createElement('div');
                title.className = 'section-title';
                title.innerText = section.title;
                sectionDiv.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'options-grid';

                section.options.forEach(option => {
                    const isSelected = selections[sectionId] === option.id;
                    const card = document.createElement('div');
                    card.className = `option-card ${isSelected ? 'selected' : ''}`;
                    
                    let content = '';
                    if (option.image) {
                        content += `<img src="${option.image}" class="option-image" onclick="event.stopPropagation(); openModal('${option.image}')">`;
                    }
                    
                    content += `
                        <span class="option-name">${option.name}</span>
                        <span class="option-cost">$${option.cost.toFixed(2)} ${option.can_have_qty ? '/ unit' : ''}</span>
                        <div class="option-note">${option.desc}</div>
                    `;

                    if (option.link) {
                        content += `<a href="${option.link}" target="_blank" class="product-link" onclick="event.stopPropagation()">View Product ↗</a>`;
                    }

                    if (isSelected && option.can_have_qty) {
                        content += `
                            <div class="qty-spinner" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="updateQty('${sectionId}', -1)">-</button>
                                <span class="qty-val">${quantities[sectionId]}</span>
                                <button class="qty-btn" onclick="updateQty('${sectionId}', 1)">+</button>
                            </div>
                        `;
                    }

                    card.innerHTML = content;
                    card.onclick = () => {
                        selections[sectionId] = option.id;
                        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
                        render();
                    };

                    grid.appendChild(card);

                    if (isSelected && !providedBy[sectionId]) {
                        const qty = option.can_have_qty ? quantities[sectionId] : 1;
                        const itemTotal = option.cost * qty;
                        total += itemTotal;
                        activeBom.push({ 
                            name: qty > 1 ? `${qty}x ${option.name}` : option.name, 
                            cost: itemTotal 
                        });
                    }
                });

                sectionDiv.appendChild(grid);
                main.appendChild(sectionDiv);
            });

            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
            
            const bomSummary = document.getElementById('bom-summary');
            bomSummary.innerHTML = activeBom.map(item => `
                <div class="bom-item">
                    <span class="bom-item-name">${item.name}</span>
                    <span>$${item.cost.toFixed(2)}</span>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
